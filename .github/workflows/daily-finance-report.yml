name: Rogelio IA news

on:
  schedule:
    # 05:00 America/Mexico_City (UTC-6). GitHub Actions cron uses UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # Allows the email step to make five attempts with a 150-second delay.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run daily report
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_FROM: rfeg1980@gmail.com
          GMAIL_TO: rfespinosagarcia@gmail.com
        run: python scripts/daily_report.py
