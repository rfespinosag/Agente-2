name: Rogelio IA news

on:
  schedule:
    # 05:00 America/Mexico_City (UTC-6). GitHub Actions cron uses UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # Allows the email step to make five attempts with a 150-second delay.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore news history
        uses: actions/cache/restore@v4
        with:
          path: .cache/news_history.json
          key: news-history-${{ github.run_id }}
          restore-keys: |
            news-history-

      - name: Prepare news history
        run: |
          mkdir -p .cache
          if [ ! -f .cache/news_history.json ]; then
            printf '{"entries":[]}' > .cache/news_history.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run daily report
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_FROM: rfeg1980@gmail.com
          GMAIL_TO: rfespinosagarcia@gmail.com
        run: python scripts/daily_report.py

      - name: Save news history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/news_history.json
          key: news-history-${{ github.run_id }}
