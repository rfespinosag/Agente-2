name: Rogelio IA news

on:
  schedule:
    # 08:00 America/Monterrey (UTC-6), same UTC offset as Mexico City.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run daily report
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          GMAIL_FROM: rfeg1980@gmail.com
          GMAIL_TO: rfespinosagarcia@gmail.com
        run: python scripts/daily_report.py
